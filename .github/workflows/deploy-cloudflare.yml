name: Deploy production frontend

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-skillswap-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      # Server-rendered pages call the API directly and need an absolute base URL.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.skillswap.asia' }}
      # KouKou AI service (separate origin, same access token as the backend).
      NEXT_PUBLIC_AI_URL: ${{ vars.NEXT_PUBLIC_AI_URL || 'https://ai.skillswap.asia' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify types
        run: npm run typecheck

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
